# diego_build_docker_image_and_upload_to_ecr.yml
name: Reusable • ECR pull & build & push

on:
  workflow_call:
    inputs:
      ref:
        # SHA, branch ou tag pra checar out. Default vazio = comportamento
        # padrão do actions/checkout (usa github.ref/github.sha do caller).
        # Necessário quando o caller fez merge na mesma run e o github.sha
        # do trigger aponta pro código pré-merge — sem isso o build pega
        # snapshot antigo e o ECR fica com tag nova apontando pra conteúdo
        # velho.
        type: string
        default: ''
      aws_region:
        type: string
        default: us-east-1
      ecr_repository:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      build_context:
        type: string
        default: .
      image_tag:
        type: string
        default: ${{ github.sha }}
      push_latest:
        type: boolean
        default: true
      env_file:
        type: string
      env_file2:
        type: string
      runner:
        # Onde o build roda. Default = runner do GitHub, ou seja, quem NAO passar este
        # input nao muda nada (retrocompativel de proposito).
        #
        # Serve para apontar um runner self-hosted, p.ex. o RunsOn:
        #   runner: "runs-on=${{ github.run_id }}-build/runner=4cpu-linux-x64/volume=80gb:gp3:500mbs:4000iops"
        #
        # ⚠️ Passe SEMPRE disco grande (`volume=`) quando usar RunsOn aqui: este build
        # precisa de ~38 GB e foi justamente a falta de disco que derrubou 4 deploys de
        # producao em 31/08/2026 (`No space left on device`). O runner do GitHub chega com
        # ~13 GB livres, e e por isso que existe o step "Liberar disco do runner" abaixo.
        type: string
        default: ubuntu-latest
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    # Build normal deste reusable leva 8-10min. O teto existe pra um build PENDURADO
    # nao segurar a fila: o caller usa `concurrency: deploy-production` com
    # `cancel-in-progress: false`, entao sem teto ele tranca deploy por ate 6h (o
    # default do GitHub). Aconteceu em 31/08/2026: 2h40 presos num unico run.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_sha: ${{ steps.build.outputs.image_sha }}
      image_latest: ${{ steps.build.outputs.image_latest }}

    steps:
      # ⚠️ `ubuntu-latest` chega com ~25 GB de SDKs pre-instalados que build nenhum
      # daqui usa (dotnet, Android, GHC, CodeQL, Swift, PowerShell), deixando so ~14 GB
      # livres. O build do `seucondominio-erp` baixa BASE_IMAGE + `:latest` (1,89 GB, do
      # overlap de assets) + buildcache (chegou a 3,0 GB) e ainda escreve as camadas de
      # duas stages, incluindo uma que sobe Postgres.
      #
      # Em 31/08/2026 isso estourou o disco em 3 deploys seguidos. O modo de falha
      # engana: o processo do RUNNER morre, entao o log corta no meio sem erro de build,
      # o step fica `in_progress` com `conclusion: null` e `--log-failed` nao devolve
      # nada — a mensagem real (`No space left on device`) so aparece na ANOTACAO do
      # check-run. Um dos runs ficou 2h40 pendurado e trancou a fila de deploy.
      #
      # Apagar o buildcache NAO resolveu: o deficit e maior que ele, e sem cache o
      # buildkit ainda reconstroi tudo (escreve mais, nao menos).
      #
      # O `df` antes/depois fica no log de proposito — e a medicao que faltava pra
      # saber de quanto disco este build realmente precisa.
      - name: Liberar disco do runner
        run: |
          echo "livre ANTES:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift \
                      /usr/local/share/powershell || true
          sudo docker image prune -af || true
          echo "livre DEPOIS:"; df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, Build, tag, and push image to ECR (SHA [+ latest])
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          # Incrementando versão
          # Incrementando versão
          aws s3 cp "s3://sc-environments/${{ inputs.env_file }}-version.env" .deploy_version || echo "0" > .deploy_version
          VERSION=$(cat .deploy_version | tr -d '\n' | tr -d '\r' || echo 0)
          NEW_VERSION=$((VERSION + 1))
          echo $NEW_VERSION > .deploy_version
          aws s3 cp .deploy_version "s3://sc-environments/${{ inputs.env_file }}-version.env" --acl private
          # Incrementando versão
          # Incrementando versão

          IMAGE_SHA="$REGISTRY/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}"
          CACHE_IMAGE="$REGISTRY/${{ inputs.ecr_repository }}:buildcache"

          # Copiando variáveis de ambiente
          aws s3 cp "s3://sc-environments/${{ inputs.env_file }}.env" envs/ || true
          aws s3 cp "s3://sc-environments/${{ inputs.env_file2 }}.env" envs/ || true

          # Garante que estamos usando BuildKit com buildx
          docker buildx create --use --name buildkit-builder || docker buildx use buildkit-builder
          docker buildx inspect --bootstrap

          # Faz o build com cache remoto
          docker buildx build \
            --platform linux/amd64 \
            --cache-from=type=registry,ref="$CACHE_IMAGE" \
            --cache-to=type=registry,ref="$CACHE_IMAGE",mode=max \
            -f "${{ inputs.dockerfile }}" \
            -t "$IMAGE_SHA" \
            "${{ inputs.build_context }}" \
            --push

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            IMAGE_LATEST="$REGISTRY/${{ inputs.ecr_repository }}:latest"
            docker buildx imagetools create -t "$IMAGE_LATEST" "$IMAGE_SHA"
            echo "image_latest=$IMAGE_LATEST" >> "$GITHUB_OUTPUT"
          fi

          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
