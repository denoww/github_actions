# build_docker_image_and_upload_to_ecr.yml
name: Reusable • ECR build & push

on:
  workflow_call:
    inputs:
      aws_region:
        type: string
        default: us-east-1
      ecr_repository:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      build_context:
        type: string
        default: .
      image_tag:
        type: string
        default: ${{ github.sha }}
      push_latest:
        type: boolean
        default: true
      # Um `CHAVE=valor` por linha, cada um vira um `--build-arg`.
      #
      # Vazio por padrão, e isso é o contrato: quem já usa este reusável (portaria,
      # sc_linker, scsip, socket-server, erp_offline) tem de continuar buildando
      # EXATAMENTE a mesma imagem. Opt-in, nunca um `--build-arg` fixo — um ARG
      # com o mesmo nome num Dockerfile alheio mudaria o build dele em silêncio.
      #
      # Uso típico: `VERSION=${{ github.sha }}`, pra o binário saber que commit é.
      build_args:
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_sha: ${{ steps.build.outputs.image_sha }}
      image_latest: ${{ steps.build.outputs.image_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR (SHA [+ latest])
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # ☠️ Por ENV, nunca `${{ inputs.build_args }}` direto no script: expressão
          # interpolada vira texto do shell antes de rodar, e um valor com `$(...)`
          # ou `;` executaria no runner — que tem a credencial de push do ECR.
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$REGISTRY/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}"

          # Um `--build-arg` por linha não vazia. Array, não string: preserva
          # espaço dentro do valor sem reinterpretar nada.
          ARGS=()
          while IFS= read -r linha; do
            linha="${linha#"${linha%%[![:space:]]*}"}"
            [ -z "$linha" ] && continue
            ARGS+=(--build-arg "$linha")
          done <<< "$BUILD_ARGS"
          echo "build args: ${#ARGS[@]} item(ns)"

          docker build -f "${{ inputs.dockerfile }}" ${ARGS[@]+"${ARGS[@]}"} -t "$IMAGE_SHA" "${{ inputs.build_context }}"
          docker push "$IMAGE_SHA"
          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            IMAGE_LATEST="$REGISTRY/${{ inputs.ecr_repository }}:latest"
            docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
            docker push "$IMAGE_LATEST"
            echo "image_latest=$IMAGE_LATEST" >> "$GITHUB_OUTPUT"
          fi
