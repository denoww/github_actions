# ⚠️ ARQUIVO GERADO — não edite à mão.
# Fonte: scripts/docker_exec_ecr.sh
# Gerar: bash scripts/gerar_workflows.sh   (o CI confere via --check)
#
# Sobe o container a partir da imagem no ECR, com o env baixado do S3.
name: restart_server_no_ec2

on:
  workflow_call:
    inputs:
      aws_region:
        type: string
        default: us-east-1
      ec2_com_tag:
        description: "Token a procurar dentro da tag 'projetos' (CSV-aware)"
        type: string
        required: true
      tag_key:
        type: string
        default: projetos
      max_attempts:
        type: number
        default: 60
      interval_secs:
        type: number
        default: 5
      ecr_repo:
        type: string
        required: true
      ports:
        type: string
        required: true
      docker_cmd:
        type: string
        required: true
      env_name:
        type: string
        default: production
      workdir:
        type: string
        default: /src
      container_name:
        type: string
        required: true
      s3_folder:
        type: string
        required: true
      log_driver:
        description: "json-file (padrao) ou awslogs"
        type: string
        default: ''
      awslogs_group:
        description: "obrigatorio quando log_driver=awslogs"
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  executar_no_ec2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Descobrir instâncias alvo (tag CSV-aware)
        id: discover
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          TAG_KEY: ${{ inputs.tag_key }}
          PROJECT_TOKEN: ${{ inputs.ec2_com_tag }}
        run: |
          set -euo pipefail
          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters Name=instance-state-name,Values=running Name=tag-key,Values="$TAG_KEY" \
            --query 'Reservations[].Instances[].[InstanceId,Tags]' \
            --output json > instances.json

          ids=$(jq -r --arg tok "$PROJECT_TOKEN" --arg key "$TAG_KEY" '
            .[]
            | {id: .[0], tags: (.[1] // [])}
            | (.tags[]? | select(.Key==$key) | .Value // "" | gsub("\\s";"")) as $val
            | select($val | test("(^|,)" + $tok + "(,|$)"))
            | .id
          ' instances.json | sort -u | tr '\n' ' ')

          echo "Targets: ${ids:-<none>}"
          echo "instance_ids=${ids}" >> "$GITHUB_OUTPUT"

